<script>
// Auto-redirect Indonesian visitors to /id/ pages (once per session)
(function () {
  var path = window.location.pathname;
  var isOnEnglish = !path.includes("/id/");
  var alreadyChecked = sessionStorage.getItem("lang-checked");

  // Only the top-level pages have a guaranteed 1:1 Indonesian counterpart.
  // Posts do not: they are written independently in each language, so a post
  // has no Indonesian equivalent to redirect to. Sending a reader from a
  // shared post link to /id/index.html would lose the article they clicked,
  // so anything not in this list is left alone.
  var translatable = [
    "index.html", "about.html", "projects.html",
    "community.html", "events.html", "news.html", "contact.html"
  ];

  if (isOnEnglish && !alreadyChecked) {
    sessionStorage.setItem("lang-checked", "true");

    var page = path.split("/").pop();
    if (page === "" || path === "/") page = "index.html";

    if (translatable.indexOf(page) === -1) return;

    fetch("https://ipapi.co/json/")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.country_code === "ID") {
          window.location.replace(window.location.origin + "/id/" + page);
        }
      })
      .catch(function () { /* silently fail, stay on English */ });
  }
})();

// Rewrite navbar links on Indonesian pages
window.addEventListener("load", function () {
  var path = window.location.pathname;
  var isIndonesian = path.includes("/id/");

  if (!isIndonesian) return;

  var labels = {
    "Home": "Beranda",
    "About": "Tentang",
    "Projects": "Proyek",
    "Community": "Komunitas",
    "Events": "Acara",
    "News": "Berita",
    "Contact": "Kontak"
  };

  var pages = ["index.html", "about.html", "projects.html", "community.html", "events.html", "news.html", "contact.html"];

  function rewriteNav() {
    var navLinks = document.querySelectorAll(".navbar-nav .nav-link");
    navLinks.forEach(function (link) {
      var href = (link.getAttribute("href") || "").trim();
      var span = link.querySelector(".menu-text");
      if (!span) return;

      var text = span.textContent.trim();

      // Skip language switcher links
      if (text.indexOf("EN") !== -1 || text.indexOf("ID") !== -1) return;

      // Translate menu labels
      if (labels[text]) {
        span.textContent = labels[text];
      }

      // Rewrite links to Indonesian versions
      pages.forEach(function (page) {
        if (href === "../" + page || href.endsWith("/" + page)) {
          var newHref = href.replace(page, "id/" + page);
          if (newHref.indexOf("/id/id/") === -1) {
            link.setAttribute("href", newHref);
          }
        }
      });
    });
  }

  rewriteNav();
  setTimeout(rewriteNav, 500);
});
</script>
